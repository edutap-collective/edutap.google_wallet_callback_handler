name: Publish container image

# Publishes the service image to the GitHub Container Registry.
#
# The image name follows the repository name (`github.repository`), so a
# repository rename carries the image with it and no name is duplicated here.
# That property matters: the packages under the pre-rename names are stale by
# design, and nothing in this file has to be touched when a repository moves.

# A release is a UTC timestamp, not a version number.
#
# This is a service: it is not on PyPI, nothing imports it, and what it ships is
# a container. The artefact therefore carries a *state*, not a promise, and the
# house convention for that is `YYYY-MM-DD_HHmm` in UTC -- the same form the
# `lmu_edutap_*` services use. Semantic versions are for the libraries, where a
# number tells whoever depends on them what changed.
#
# The glob used to be `v*.*.*`, which meant a dated tag triggered nothing at all:
# no build, no image, no error. `make release` produces exactly the shape below.
on:
  push:
    branches: ["main"]
    tags: ["20[0-9][0-9]-[0-1][0-9]-[0-3][0-9]_[0-2][0-9][0-5][0-9]"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# A second push to the same branch supersedes the first; a half-finished build
# of an outdated commit is never worth the runner minutes.
#
# The group is keyed on the workflow name rather than a literal, so renaming the
# workflow also leaves its old group behind. That is not cosmetic: a run of the
# previous workflow is wedged in `queued` on this repository and can neither be
# cancelled (HTTP 500) nor deleted (HTTP 403), which blocked every later run for
# `main`. A fresh group is the only way out that does not need GitHub support.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Skipped on pull requests: a fork must not be able to push an image.
      # The build itself still runs, so a broken Dockerfile fails the review.
      - name: Log in to ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` means "the tip of main" and nothing more -- honest, and not
          # what a deployment should pin. Deployments pin the dated release tag
          # together with its digest; the sha tag is the unambiguous fallback.
          #
          # `type=ref,event=tag` takes the tag name verbatim. The `type=semver`
          # rules it replaces could not match a timestamp, so a dated tag would
          # have produced an image labelled only by its commit sha.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
