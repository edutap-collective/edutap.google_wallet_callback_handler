# The pipeline calls the Makefile, not a second copy of the commands.
#
# What stood here before was the untouched GitHub starter workflow: it installed
# flake8 by hand, ran it once with `--exit-zero` (so it could not fail), and
# never looked at formatting or types at all. A pipeline that cannot go red for
# a style problem is not checking style, it is decorating the repository.

name: Python package

on:
  push:
    branches: ["main"]
  # No branch filter on pull requests. It used to say `branches: ["main"]`, which
  # reads like "the pull requests that matter" and means "the pull requests whose
  # *target* is main" -- so a stacked pull request, one that targets the branch
  # below it in a chain, got no checks at all. GitHub reports that as "no checks
  # reported", which is easy to read as "nothing to run".
  pull_request:

jobs:
  lint:
    name: lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # ruff check, ruff format --check, ty check -- exactly `make lint` locally.
      - run: make lint

  test:
    name: test on ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: make test-local
