# Run these with prek (`prek install`, `prek run --all-files`). The file format
# is the one pre-commit reads, so either runner works on it.
#
# What used to be five hooks -- pyupgrade, isort, black, flake8, mypy -- is now
# two: ruff replaces the first four, and the type checker runs from the Makefile
# rather than here, because it needs the project's own environment and a hook
# that builds its own cannot see the installed dependencies.
ci:
  autofix_prs: false
  autoupdate_schedule: monthly

repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.4
  hooks:
  - id: ruff-check
    args: [--fix]
  - id: ruff-format
- repo: https://github.com/codespell-project/codespell
  rev: v2.4.3
  hooks:
  - id: codespell
    additional_dependencies:
    - tomli
- repo: https://github.com/mgedmin/check-manifest
  rev: "0.51"
  hooks:
  - id: check-manifest
- repo: https://github.com/regebro/pyroma
  rev: "5.0.1"
  hooks:
  - id: pyroma
- repo: https://github.com/mgedmin/check-python-versions
  rev: "0.24.2"
  hooks:
  - id: check-python-versions
    args: ['--only', 'pyproject.toml']
