[project]
name = "edutap.wallet_google_callback_handler"
version = "1.1.0.dev0"
description = "A Google Wallet Callback-Handler Implementation."
keywords = ["wallet", "google", "callback-handler", ]
readme = "README.md"
authors = [
    {name = "Alexander Loechel", email = "Alexander.Loechel@lmu.de"},
    {name = "Philipp Auersperg-Castell", email = "phil@bluedynamics.com"},
    {name = "Jens Klein", email = "jk@kleinundpartner.at"},
]
requires-python = ">=3.10"
license = { text = "EUPL 1.2" }
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Object Brokering",
    "Operating System :: OS Independent",
]
dependencies = [
    "edutap-wallet-google[callback]>=1.0.0b1",
    "sentry-sdk[fastapi]",
    "fastapi>=0.115.7",
    "uvicorn[standard]>=0.34.0",
    "pydantic[email,dotenv]>=2.0",
    "pydantic-settings",
    "httpx",
    "structlog",
  ]

[project.urls]
Source = "https://github.com/edutap-collective/edutap.wallet_google_callback_handler"
Issues = "https://github.com/edutap-collective/edutap.wallet_google_callback_handler/issues"
Documentation = "https://docs.edutap.eu/packages/edutap_wallet_google_callback_handler/index.html"

[project.optional-dependencies]
kafka = [
    "aiokafka",
]
test = [
    "pytest",
    "pytest-asyncio",
    # Not merely the optional runtime extra: kafka.py imports aiokafka at module
    # level, so every test that touches this package needs it present -- even the
    # ones that never reach a broker.
    "aiokafka",
]
typecheck  = [
    "mypy",
    "pytest-stub",
]
dev = [
    "pdbpp",
    "ipython",
]

[project.scripts]
google-wallet-callback-handler = "edutap.wallet_google_callback_handler.main:main"

# What makes this service more than an empty FastAPI app.
#
# `edutap.wallet_google` does not import a handler, it discovers one: the
# callback route calls `get_callback_handlers()`, which reads this entry point
# group and raises `NotImplementedError` when it comes up empty -- answering
# every callback with HTTP 500 and writing nothing to Kafka. Until 2026-08-26
# this package declared no such entry point at all, so that is exactly what the
# deployed service did, while its health check kept reporting healthy because it
# only ever looked at the Kafka producer.
#
# The name must *start with* `CallbackHandler`: the library filters the group
# with `ep.name.startswith(...)`, which is also what lets a package register
# several handlers (`CallbackHandlerKafka`, `CallbackHandlerAudit`, ...).
[project.entry-points."edutap.wallet_google.plugins"]
CallbackHandler = "edutap.wallet_google_callback_handler.kafka:KafkaCallbackHandler"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
minversion = "6.0"
testpaths = [
    "tests",
]

[tool.isort]
profile = "black"
force_alphabetical_sort = true
force_single_line = true
lines_after_imports = 2

[tool.black]
target-version = ["py310"]
include = "src"

[tool.codespell]
ignore-words-list = "discreet,"

[tool.check-manifest]
ignore = [
    ".editorconfig",
    ".pre-commit-config.yaml",
    "tox.ini",
    "mypy.ini",
    ".flake8",
    "mx.ini",
]
